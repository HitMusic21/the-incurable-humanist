<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Primary Meta Tags (overridden per-page by the SEO component at runtime) -->
    <title>The Incurable Humanist | Grief, Migration, and Art</title>
    <meta name="title" content="The Incurable Humanist | Grief, Migration, and Art" />
    <meta
      name="description"
      content="Denise Rodriguez Dao writes The Incurable Humanist — a weekly newsletter on grief, migration, and art. Read the archive, listen to audio essays, or book a talk."
    />
    <meta name="author" content="Denise Rodriguez Dao" />
    <meta
      name="keywords"
      content="grief, migration, art, newsletter, personal essays, Denise Rodriguez Dao, immigration, Latin American art, diaspora"
    />
    <meta name="robots" content="index, follow" />

    <!-- Google Search Console verification.
         TODO(setup): replace the value below with the token from https://search.google.com/search-console -->
    <meta name="google-site-verification" content="REPLACE_WITH_GSC_TOKEN" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://theincurablehumanist.com/" />
    <meta property="og:title" content="The Incurable Humanist | Grief, Migration, and Art" />
    <meta
      property="og:description"
      content="Denise Rodriguez Dao writes The Incurable Humanist — a weekly newsletter on grief, migration, and art."
    />
    <meta property="og:image" content="https://theincurablehumanist.com/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="The Incurable Humanist" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://theincurablehumanist.com/" />
    <meta property="twitter:title" content="The Incurable Humanist | Grief, Migration, and Art" />
    <meta
      property="twitter:description"
      content="Denise Rodriguez Dao writes The Incurable Humanist — a weekly newsletter on grief, migration, and art."
    />
    <meta property="twitter:image" content="https://theincurablehumanist.com/og-image.svg" />
    <meta property="twitter:site" content="@TheIncurableHum" />
    <meta property="twitter:creator" content="@TheIncurableHum" />

    <!-- Theme Color (matches --accent plum in globals.css) -->
    <meta name="theme-color" content="#5a4370" />
    <meta name="msapplication-TileColor" content="#5a4370" />

    <!-- Canonical (overridden per-page) -->
    <link rel="canonical" href="https://theincurablehumanist.com/" />

    <!-- RSS discovery (feed generated at build time — see frontend/scripts/generate-sitemap.mjs) -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="The Incurable Humanist — Essays"
      href="/rss.xml"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: Headings (Cormorant Garamond), Body/Nav (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Sitewide JSON-LD (@graph: Person + WebSite).
         Article schema is added per-page via the SEO component.
         Server-rendered here so Google + AI Overviews can read it without executing JS. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://theincurablehumanist.com/about#denise",
            "name": "Denise Rodriguez Dao",
            "givenName": "Denise",
            "familyName": "Rodriguez Dao",
            "url": "https://theincurablehumanist.com/about",
            "image": "https://theincurablehumanist.com/founder.jpg",
            "jobTitle": "Writer, Immigration Attorney",
            "description": "Denise Rodriguez Dao writes The Incurable Humanist, a weekly newsletter on grief, migration, and art. She is a foreign attorney at a boutique immigration law firm in Manhattan.",
            "knowsAbout": ["Grief", "Migration", "Art", "Latin American Art", "Diaspora"],
            "alumniOf": [
              { "@type": "EducationalOrganization", "name": "Christie's Education, New York" },
              { "@type": "EducationalOrganization", "name": "Andrés Bello Catholic University" }
            ],
            "sameAs": [
              "https://www.instagram.com/theincurablehumanist/",
              "https://www.tiktok.com/@theincurablehumanist",
              "https://www.facebook.com/profile.php?id=61581842306462",
              "https://www.linkedin.com/company/the-incurable-humanist/about/",
              "https://x.com/TheIncurableHum",
              "https://theincurablehumanist.substack.com"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://theincurablehumanist.com/#website",
            "url": "https://theincurablehumanist.com/",
            "name": "The Incurable Humanist",
            "description": "Grief, migration, and art — and what gets inherited anyway.",
            "publisher": { "@id": "https://theincurablehumanist.com/about#denise" },
            "inLanguage": "en-US"
          }
        ]
      }
    </script>

    <!--
      Third-party marketing tags (Google Analytics, Meta Pixel, TikTok Pixel) are loaded
      conditionally in src/main.tsx AFTER consent is granted (per CNIL 2025 enforcement).
      Google Search Console verification meta above requires no consent (Google is sole
      data controller and drops no cookies on the visitor for GSC alone).
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

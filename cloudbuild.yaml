substitutions:
  _REGION: us-central1
  _SERVICE_BACKEND: tih-backend
  _SERVICE_FRONTEND: tih-frontend
  _REPO_NAME: the-incurable-humanist

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/${_REPO_NAME}-backend:$COMMIT_SHA', '-f', 'backend/Dockerfile', '.']

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/${_REPO_NAME}-frontend:$COMMIT_SHA', '-f', 'frontend/Dockerfile', '.']

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_REPO_NAME}-backend:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_REPO_NAME}-frontend:$COMMIT_SHA']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run','deploy','${_SERVICE_BACKEND}',
        '--image','gcr.io/$PROJECT_ID/${_REPO_NAME}-backend:$COMMIT_SHA',
        '--region','${_REGION}',
        '--platform','managed',
        '--allow-unauthenticated',
        '--set-env-vars','PYTHONUNBUFFERED=1'
      ]

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run','deploy','${_SERVICE_FRONTEND}',
        '--image','gcr.io/$PROJECT_ID/${_REPO_NAME}-frontend:$COMMIT_SHA',
        '--region','${_REGION}',
        '--platform','managed',
        '--allow-unauthenticated'
      ]

images:
  - 'gcr.io/$PROJECT_ID/${_REPO_NAME}-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_REPO_NAME}-frontend:$COMMIT_SHA'

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tih_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/tih_db
      DB_SSL: disable
      PORT: 8000
      # Local scheduler auth; matches Makefile default. Override in prod via
      # `gcloud run services update … --set-env-vars SCHEDULER_TOKEN=…`.
      SCHEDULER_TOKEN: dev-tick-token
      # Passed through from the host shell — used by webhook signature verify.
      # Local smoke test sets this from a generated keypair; unset by default
      # so the webhook fails closed (503).
      SENDGRID_WEBHOOK_PUBLIC_KEY: ${SENDGRID_WEBHOOK_PUBLIC_KEY:-}
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:

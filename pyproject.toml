[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
float_to_top = true
force_sort_within_sections = true
order_by_type = false
sections = ["STDLIB", "THIRDPARTY", "FIRSTPARTY"]
src_paths = ["backend"]
known_first_party = ["backend"]
combine_as_imports = true

[tool.ruff]
line-length = 100
exclude = [
  ".git",
  "backend/venv",
  "frontend/node_modules",
]

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","C4"]
# E203: whitespace-before-punctuation (black/isort clash).
# B008: function calls in argument defaults — FastAPI's `Depends()`, `Query()`,
#       `Body()`, `Header()` idioms use this pervasively. Not a real defect here.
ignore = ["E203", "B008"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "backend/tests",
]
pythonpath = ["backend"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
